<div class="page-container">
      <div class="page-header">
        <h2>Settings</h2>
        <p class="subtitle">Customize your experience</p>
      </div>

      <div class="settings-group glass-panel">
        <h3>Profile</h3>
        <div class="setting-item">
          <div class="label">
            <span>Display Name</span>
            <p>Saket Kumar</p>
          </div>
          <button class="edit-btn">Edit</button>
        </div>
        <div class="setting-item">
           <div class="label">
            <span>Email</span>
            <p>saket&#64;example.com</p>
          </div>
        </div>
      </div>

      <div class="settings-group glass-panel">
        <h3>Preferences</h3>
        <div class="setting-item">
          <div class="label">
            <span>Dark Mode</span>
            <p>Enable dark theme across the app</p>
          </div>
          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider round"></span>
          </label>
        </div>
        <div class="setting-item">
           <div class="label">
            <span>Notifications</span>
            <p>Receive alerts for security events</p>
          </div>
          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider round"></span>
          </label>
        </div>
         <div class="setting-item">
           <div class="label">
            <span>Temperature Unit</span>
            <p>Celsius (°C) / Fahrenheit (°F)</p>
          </div>
          <select class="select-input">
            <option>Celsius (°C)</option>
            <option>Fahrenheit (°F)</option>
          </select>
        </div>
      </div>
      
      <div class="settings-group glass-panel">
        <h3>System</h3>
        <div class="setting-item">
          <div class="label">
            <span>Hub Version</span>
            <p>v2.4.1 (Latest)</p>
          </div>
          <button class="check-btn">Check for Updates</button>
        </div>
      </div>
    </div>
